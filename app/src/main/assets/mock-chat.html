<!DOCTYPE html>
<!--
  Mock chat page used by the adapter self-tests (TZ §5.3, §8).

  It deliberately exposes:
    - role="log" + aria-live="polite"   → SEMANTIC_DOM strategy for chat.observe
    - role="textbox" (textarea)          → SEMANTIC_DOM strategy for chat.input.fill
    - <button aria-label="Send">         → SEMANTIC_DOM strategy for chat.send
    - POST /api/chat that emits SSE-like "data:" chunks → NETWORK strategy

  Everything the bridge boot script needs to satisfy its probes is here.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mock GLM chat</title>
  <style>
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
           background: #fcfcff; color: #101418; padding: env(safe-area-inset-top) 12px 12px; }
    header { font-weight: 600; padding: 12px 0; border-bottom: 1px solid #e1e4e8; }
    #log { min-height: 240px; padding: 8px; border: 1px solid #e1e4e8;
           border-radius: 8px; background: white; margin: 8px 0; }
    .turn { padding: 6px 8px; border-radius: 8px; margin: 4px 0; }
    .user { background: #d1e4ff; }
    .assistant { background: #f1f3f5; }
    .role { font-size: 11px; opacity: 0.7; }
    textarea { width: 100%; min-height: 60px; padding: 8px; border-radius: 8px;
               border: 1px solid #e1e4e8; font: inherit; box-sizing: border-box; }
    button { margin-top: 8px; padding: 8px 14px; border: none; border-radius: 8px;
             background: #2a6bb5; color: white; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      body { background: #101418; color: #fcfcff; }
      #log { background: #1a1f24; border-color: #2c3338; }
      textarea { background: #1a1f24; color: #fcfcff; border-color: #2c3338; }
    }
  </style>
</head>
<body>
  <header>Mock GLM chat</header>
  <p>Self-test target page. Used by the adapter to verify capabilities
     without hitting the live site. Toggle it on in Settings.</p>

  <div id="log" role="log" aria-live="polite" aria-label="chat log"></div>

  <label for="input" style="display:none">Message</label>
  <textarea id="input" role="textbox" aria-label="message" placeholder="Type a message…"></textarea>
  <button id="send" aria-label="Send">Send</button>

  <script>
    (function () {
      var log = document.getElementById('log');
      var input = document.getElementById('input');
      var send = document.getElementById('send');

      function addTurn(role, text) {
        var div = document.createElement('div');
        div.className = 'turn ' + role.toLowerCase();
        div.innerHTML = '<div class="role">' + role + '</div>' + text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
      }

      send.addEventListener('click', function () {
        var text = input.value.trim();
        if (!text) return;
        addTurn('USER', text);
        input.value = '';
        // Emit a fake SSE-style stream to /api/chat — the bridge picks it up
        // as a NetworkStreamChunk that the `network` strategy parses.
        setTimeout(function () {
          addTurn('ASSISTANT', '(mock stream) Got: ' + text);
          // The page also fetches a fake endpoint so the bridge can probe it.
          fetch('/api/chat', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              messages: [
                { role: 'user', content: text },
                { role: 'assistant', content: '(mock stream) Got: ' + text }
              ]
            })
          }).catch(function () { /* swallow — endpoint doesn't exist on this mock */ });
        }, 150);
      });

      // Allow Enter to send.
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send.click();
        }
      });
    })();
  </script>
</body>
</html>
